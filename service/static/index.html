<!DOCTYPE html>
<html>
  <head>
    <title>Promotions RESTful Service</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="static/css/cerulean_bootstrap.min.css">
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <h1>Promotions REST API Service</h1>
      </div>

      <!-- Flash Message -->
      <div class="table-responsive">
        <table class="table">
          <tr><td>Status:</td><td><span id="flash_message"></span></td></tr>
        </table>
      </div>

      <!-- FORM -->
      <div class="col-md-12" id="form_data">
        <h3>Create, Retrieve, Update, Cancel, Delete and Search Promotions:</h3>
        <div class="well">
          <div class="form-horizontal">
            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_id">Promotion ID:</label>
              <div class="col-sm-6">
                <input type="text" class="form-control" id="promotion_id" placeholder="Enter Promotion ID">
              </div>
              <div class="col-sm-4">
                <button type="button" class="btn btn-primary" id="retrieve-btn">Retrieve</button>
                <button type="button" class="btn btn-danger" id="delete-btn">Delete</button>
              </div>
            </div>
          </div>

          <div class="form-horizontal">
            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_product_id">Product ID:</label>
              <div class="col-sm-10">
                <input type="text" class="form-control" id="promotion_product_id" placeholder="Enter Product ID">
              </div>
            </div>

            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_campaign">Campaign:</label>
              <div class="col-sm-10">
                <input type="text" class="form-control" id="promotion_campaign" placeholder="e.g. black friday">
              </div>
            </div>

            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_description">Description:</label>
              <div class="col-sm-10">
                <input type="text" class="form-control" id="promotion_description" placeholder="Describe the promotion">
              </div>
            </div>

            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_status">Status:</label>
              <div class="col-sm-10">
                <select class="form-control" id="promotion_status">
                                    <option value="" selected></option>
                  <option value="active">active</option>
                  <option value="inactive">inactive</option>
                  <option value="cancelled">cancelled</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_final_price">Final Price:</label>
              <div class="col-sm-10">
                <input type="text" class="form-control" id="promotion_final_price" placeholder="e.g. 19.99">
              </div>
            </div>

            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_start_date">Start Date:</label>
              <div class="col-sm-10">
                <input type="date" class="form-control" id="promotion_start_date">
              </div>
            </div>

            <div class="form-group">
              <label class="control-label col-sm-2" for="promotion_end_date">End Date:</label>
              <div class="col-sm-10">
                <input type="date" class="form-control" id="promotion_end_date">
              </div>
            </div>

            <div class="form-group">
              <div class="col-sm-offset-2 col-sm-10">
                <button type="button" class="btn btn-primary" id="search-btn">Search</button>
                <button type="button" class="btn btn-primary" id="clear-btn">Clear</button>
                <button type="button" class="btn btn-success" id="create-btn">Create</button>
                <button type="button" class="btn btn-warning" id="update-btn">Update</button>
                <button type="button" class="btn btn-danger" id="cancel-btn">Cancel</button>
                <button type="button" class="btn btn-success" id="activate-btn">Activate</button>
                <button type="button" class="btn btn-warning" id="deactivate-btn">Deactivate</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Search Results -->
      <div class="table-responsive col-md-12" id="search_results">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Promotion ID</th><th>Product ID</th><th>Campaign</th><th>Description</th>
              <th>Status</th><th>Final Price</th><th>Start Date</th><th>End Date</th>
            </tr>
          </thead>
        </table>
      </div>

      <footer><br><br><p>&copy; NYU DevOps Promotions Squad 2026</p></footer>
    </div>

    <script type="text/javascript" src="static/js/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="static/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="static/js/rest_api.js"></script>
  </body>
</html>

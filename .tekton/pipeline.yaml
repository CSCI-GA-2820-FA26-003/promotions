apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: promotions-pipeline
spec:
  description: CD pipeline for the Promotions service
  params:
    - name: GIT_REPO
      type: string
    - name: GIT_REF
      type: string
      default: master
  workspaces:
    - name: pipeline-workspace
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: pipeline-workspace
      params:
        - name: URL
          value: $(params.GIT_REPO)
        - name: REVISION
          value: $(params.GIT_REF)
        - name: DELETE_EXISTING
          value: "true"
    - name: lint
      runAfter: [clone]
      taskRef:
        name: lint
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: tests
      runAfter: [clone]
      taskRef:
        name: unit-tests
      workspaces:
        - name: source
          workspace: pipeline-workspace
